<svg xmlns="http://www.w3.org/2000/svg" height="600px" width="600px">
    <style>
        .olho {
            fill: #8b5cf6;
            filter: drop-shadow(0 0 8px #a855f7);
            animation: pulsoOlho 3s ease-in-out infinite;
        }
        .joia {
            fill: #8b5cf6;
            animation: pulsoOlho 3s ease-in-out infinite;
        }
        @keyframes pulsoOlho {
            0%, 100% { fill: #8b5cf6; opacity: 1; }
            50% { fill: #c4b5fd; opacity: 0.7; }
        }
    </style>
    <defs>
        <clipPath id="zoio">
            <polygon points="150,165 270,210 390,165 390,260 140,240" />
        </clipPath>
    </defs>
    <!-- antena -->
    <polygon points="210,25 210,0 225,0 225,25" style="fill:grey;stroke:grey" />
    <!-- chapeu topo -->
    <polygon points="190,55 205,25 270,5 340,25 350,55, 280,45, 270,30 260,45" style="fill:grey;stroke:grey" />
    <!-- joia chapeu -->
    <polygon points="250,80 270,60, 290,80 270,90" style="fill:grey;stroke:grey" />
    <polygon points="255,80 270,65, 285,80 270,87,5" style="fill:DimGrey;stroke:DimGrey" />
    <!-- joia chapeu2 -->
    <circle class="joia" cx="270" cy="78" r="5" fill="#8b5cf6"/>
    <!-- chapeu baixo -->
    <polygon
        points="165,100 250,95 265,100 260,105 270,125 280,105 275,100 290,95 375,100 470,115 540,125 390,145 270,190 150,145 0,125"
        style="fill:grey;stroke:grey" />
    <!--mask  -->
    <!-- <polygon points="150,165 270,210 390,165 390,260 140,240" /> -->
    <!-- fundo zoio dir -->
    <polygon points="280,195 345,170 355,190 345,210 325,220 " style="fill:darkgrey;stroke:darkgrey" />
    <!-- fundo zoio esq -->
    <polygon points="260,195 195,170 185,190 195,210 215,220 " style="fill:darkgrey;stroke:darkgrey" />
    <!-- zoio esq -->
    <circle class="olho" cx="220" cy="185" r="20" fill="#8b5cf6" clip-path="url(#zoio)"/>
    <!-- zoio dir -->
    <circle class="olho" cx="320" cy="185" r="20" fill="#8b5cf6" clip-path="url(#zoio)"/>
    <!--fundo gola esquerda -->
    <polygon points="150,250 175,230 190,270" style="fill:DimGrey" />
    <!--fundo gola direita -->
    <polygon points="390,250 375,230 350,270" style="fill:DimGrey" />
    <!-- gola -->
    <polygon points="150,250 270,270 390,250 390,325 270,345 150,325" style="fill:grey;stroke:grey" /> 
</svg>